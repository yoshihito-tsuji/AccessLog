<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リリースダウンロード統計</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --navy: #1a365d;
            --navy-light: #2c5282;
            --navy-dark: #0f2642;
            --gray-bg: #f7fafc;
            --gray-light: #edf2f7;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --white: #ffffff;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--gray-bg);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: var(--navy);
            font-weight: 700;
        }

        header p {
            font-size: 1.1em;
            color: var(--text-secondary);
        }

        .period-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .period-btn {
            padding: 8px 20px;
            border: 2px solid var(--gray-light);
            background: var(--white);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .period-btn:hover {
            border-color: var(--navy-light);
            color: var(--navy);
        }

        .period-btn.active {
            background: var(--navy);
            color: var(--white);
            border-color: var(--navy);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--white);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 2px 8px var(--shadow);
            text-align: center;
            transition: all 0.3s ease;
            border-left: 4px solid var(--navy);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .stat-card .number {
            font-size: 2.8em;
            font-weight: 700;
            color: var(--navy);
        }

        .chart-container {
            background: var(--white);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px var(--shadow);
            margin-bottom: 30px;
        }

        .chart-container h2 {
            color: var(--navy);
            margin-bottom: 20px;
            font-size: 1.4em;
            font-weight: 600;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2em;
            padding: 50px;
        }

        .error {
            background: #fc8181;
            color: var(--white);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        footer {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
            padding: 20px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .stat-card .number {
                font-size: 2.2em;
            }

            .chart-wrapper {
                height: 300px;
            }

            .period-selector {
                gap: 8px;
            }

            .period-btn {
                padding: 6px 16px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>アプリダウンロード統計</h1>
            <p>リリース別ダウンロード数の推移</p>
            <div class="period-selector">
                <button class="period-btn" data-period="7">7日間</button>
                <button class="period-btn active" data-period="30">30日間</button>
                <button class="period-btn" data-period="90">90日間</button>
                <button class="period-btn" data-period="180">180日間</button>
                <button class="period-btn" data-period="365">365日間</button>
            </div>
        </header>

        <div class="stats-grid" id="stats-grid">
            <!-- 統計カードは動的に生成 -->
        </div>

        <div id="charts-container">
            <!-- グラフは動的に生成 -->
        </div>

        <footer>
            <p>最終更新: <span id="last-update">-</span></p>
            <p>データソース: GitHub Releases API</p>
        </footer>
    </div>

    <script>
        // ========================================
        // 設定: 環境変更時はここを編集
        // ========================================

        // パスワード設定（変更する場合はREADME参照）
        const ACCESS_PASSWORD = 'AccessLog20251114';

        // Google Apps Script Web APIのURL
        const API_URL = 'https://script.google.com/macros/s/AKfycbxZx9xCYNYVepuxRsPpWwd4k4zpuq1yivyC6P3nWEEnbYHaIyelOdgVAGvHhi7-rzYeYw/exec';

        // ========================================
        // パスワード認証
        // ========================================
        (function checkPassword() {
            const stored = sessionStorage.getItem('dashboard_auth');

            if (stored !== ACCESS_PASSWORD) {
                const input = prompt('パスワードを入力してください:');

                if (input !== ACCESS_PASSWORD) {
                    document.body.innerHTML = `
                        <div style="
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            min-height: 100vh;
                            background: var(--gray-bg);
                            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                        ">
                            <div style="
                                background: white;
                                padding: 40px;
                                border-radius: 12px;
                                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                                text-align: center;
                                max-width: 400px;
                            ">
                                <h1 style="color: #1a365d; margin-bottom: 20px;">アクセス拒否</h1>
                                <p style="color: #718096;">正しいパスワードを入力してください。</p>
                                <button onclick="location.reload()" style="
                                    margin-top: 20px;
                                    padding: 10px 24px;
                                    background: #1a365d;
                                    color: white;
                                    border: none;
                                    border-radius: 8px;
                                    cursor: pointer;
                                    font-size: 1em;
                                ">再試行</button>
                            </div>
                        </div>
                    `;
                    throw new Error('Authentication failed');
                }

                sessionStorage.setItem('dashboard_auth', ACCESS_PASSWORD);
            }
        })();

        // ========================================
        // アプリごとの色パレット（濃紺をベースに視認性を確保）
        // ========================================
        const APP_COLOR_PALETTES = {
            'GaQ (Mac)': [
                { bg: 'rgba(26, 54, 93, 0.85)', border: 'rgba(26, 54, 93, 1)' },      // 濃紺（メイン）
                { bg: 'rgba(72, 187, 120, 0.85)', border: 'rgba(72, 187, 120, 1)' },  // 緑（補色）
                { bg: 'rgba(66, 153, 225, 0.85)', border: 'rgba(66, 153, 225, 1)' },  // 青
                { bg: 'rgba(159, 122, 234, 0.85)', border: 'rgba(159, 122, 234, 1)' }, // 紫
                { bg: 'rgba(237, 137, 54, 0.85)', border: 'rgba(237, 137, 54, 1)' }   // オレンジ
            ],
            'GaQ (Windows)': [
                { bg: 'rgba(26, 54, 93, 0.85)', border: 'rgba(26, 54, 93, 1)' },      // 濃紺（メイン）
                { bg: 'rgba(72, 187, 120, 0.85)', border: 'rgba(72, 187, 120, 1)' },  // 緑（補色）
                { bg: 'rgba(66, 153, 225, 0.85)', border: 'rgba(66, 153, 225, 1)' },  // 青
                { bg: 'rgba(159, 122, 234, 0.85)', border: 'rgba(159, 122, 234, 1)' }, // 紫
                { bg: 'rgba(237, 137, 54, 0.85)', border: 'rgba(237, 137, 54, 1)' }   // オレンジ
            ],
            'PoPuP': [
                { bg: 'rgba(26, 54, 93, 0.85)', border: 'rgba(26, 54, 93, 1)' },      // 濃紺（メイン）
                { bg: 'rgba(56, 178, 172, 0.85)', border: 'rgba(56, 178, 172, 1)' },  // ティール
                { bg: 'rgba(99, 179, 237, 0.85)', border: 'rgba(99, 179, 237, 1)' },  // スカイブルー
                { bg: 'rgba(144, 205, 244, 0.85)', border: 'rgba(144, 205, 244, 1)' }, // ライトブルー
                { bg: 'rgba(246, 173, 85, 0.85)', border: 'rgba(246, 173, 85, 1)' }   // ゴールド
            ]
        };

        let currentCharts = {};
        let currentPeriod = 30;

        // 日別推移データを取得
        async function loadTimelineData(days) {
            try {
                // Google Apps Script APIからデータを取得
                const response = await fetch(`${API_URL}?type=timeline&days=${days}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('データ読み込みエラー:', error);
                // エラー時はサンプルデータを返す（開発用）
                console.warn('サンプルデータを使用します');
                const data = generateSampleData(days);
                return data;
            }
        }

        // 開発用: サンプルデータを生成（バージョン別）
        function generateSampleData(days) {
            const dates = [];
            const today = new Date();

            for (let i = days - 1; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                dates.push(date.toISOString().split('T')[0]);
            }

            // すべてゼロのデータを返す
            const zeros = dates.map(() => 0);

            return {
                status: 'success',
                dates: dates,
                apps: {
                    'GaQ (Mac)': {
                        versions: {},
                        total: zeros
                    },
                    'GaQ (Windows)': {
                        versions: {},
                        total: zeros
                    },
                    'PoPuP': {
                        versions: {},
                        total: zeros
                    }
                }
            };
        }

        // 統計カードを生成
        function renderStatsCards(data) {
            const statsGrid = document.getElementById('stats-grid');
            statsGrid.innerHTML = '';

            let totalDownloads = 0;
            const appTotals = {};

            // 各アプリの合計を計算
            Object.keys(data.apps).forEach(appName => {
                const sum = data.apps[appName].total.reduce((a, b) => a + b, 0);
                appTotals[appName] = sum;
                totalDownloads += sum;
            });

            // 各アプリのカードを生成
            Object.keys(appTotals).forEach(appName => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <h3>${appName} ダウンロード数</h3>
                    <div class="number">${appTotals[appName].toLocaleString()}</div>
                `;
                statsGrid.appendChild(card);
            });

            // 合計カードを追加
            const totalCard = document.createElement('div');
            totalCard.className = 'stat-card';
            totalCard.innerHTML = `
                <h3>合計ダウンロード数</h3>
                <div class="number">${totalDownloads.toLocaleString()}</div>
            `;
            statsGrid.appendChild(totalCard);
        }

        // アプリごとに積層棒グラフを描画
        function renderCharts(data) {
            const chartsContainer = document.getElementById('charts-container');
            chartsContainer.innerHTML = '';

            // 既存のグラフを破棄
            Object.values(currentCharts).forEach(chart => chart.destroy());
            currentCharts = {};

            // 各アプリごとにグラフを作成
            Object.keys(data.apps).forEach(appName => {
                const appData = data.apps[appName];
                const colorPalette = APP_COLOR_PALETTES[appName] || APP_COLOR_PALETTES['GaQ (Mac)'];

                // グラフコンテナを作成
                const chartContainer = document.createElement('div');
                chartContainer.className = 'chart-container';

                const chartTitle = document.createElement('h2');
                chartTitle.textContent = `${appName} ダウンロード数推移`;

                const chartWrapper = document.createElement('div');
                chartWrapper.className = 'chart-wrapper';

                const canvas = document.createElement('canvas');
                canvas.id = `chart-${appName}`;

                chartWrapper.appendChild(canvas);
                chartContainer.appendChild(chartTitle);
                chartContainer.appendChild(chartWrapper);
                chartsContainer.appendChild(chartContainer);

                // データセットを構築（バージョンごと）
                const versions = Object.keys(appData.versions);
                const datasets = versions.map((version, idx) => {
                    const color = colorPalette[idx % colorPalette.length];

                    return {
                        label: version,
                        data: appData.versions[version],
                        backgroundColor: color.bg,
                        borderColor: color.border,
                        borderWidth: 1
                    };
                });

                // グラフを描画
                const ctx = canvas.getContext('2d');
                currentCharts[appName] = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.dates,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                labels: {
                                    font: {
                                        size: 12,
                                        weight: '500'
                                    },
                                    padding: 15,
                                    usePointStyle: true
                                }
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                backgroundColor: 'rgba(26, 54, 93, 0.9)',
                                padding: 12,
                                titleFont: {
                                    size: 13
                                },
                                bodyFont: {
                                    size: 12
                                },
                                callbacks: {
                                    footer: (tooltipItems) => {
                                        const total = tooltipItems.reduce((sum, item) => sum + item.parsed.y, 0);
                                        return `合計: ${total} DL`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                stacked: true,
                                grid: {
                                    display: false
                                },
                                ticks: {
                                    font: {
                                        size: 11
                                    },
                                    maxRotation: 45,
                                    minRotation: 45,
                                    autoSkip: true,
                                    maxTicksLimit: 15
                                }
                            },
                            y: {
                                stacked: true,
                                beginAtZero: true,
                                ticks: {
                                    precision: 0,
                                    font: {
                                        size: 11
                                    }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            }
                        }
                    }
                });
            });
        }

        // データを読み込んで表示
        async function loadAndRender(days) {
            try {
                const data = await loadTimelineData(days);

                if (data.status === 'error') {
                    throw new Error(data.message);
                }

                renderStatsCards(data);
                renderCharts(data);

                // 最終更新日時を設定
                document.getElementById('last-update').textContent =
                    new Date().toLocaleString('ja-JP');
            } catch (error) {
                document.querySelector('.container').innerHTML = `
                    <div class="error">
                        <h2>エラー</h2>
                        <p>データの読み込みに失敗しました: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 期間選択ボタンのイベントリスナー
        function setupPeriodSelector() {
            const buttons = document.querySelectorAll('.period-btn');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // アクティブ状態を切り替え
                    buttons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    // 期間を取得して再描画
                    const days = parseInt(button.dataset.period);
                    currentPeriod = days;
                    loadAndRender(days);
                });
            });
        }

        // 初期化
        async function init() {
            setupPeriodSelector();
            await loadAndRender(currentPeriod);
        }

        // ページ読み込み時に実行
        init();
    </script>
</body>
</html>
